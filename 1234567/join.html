<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申请加入 · 天明昭世</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
}

.card {
    max-width: 600px;
    width: 100%;
    background: rgba(18, 10, 32, 0.9);
    border-radius: 16px;
    padding: 50px 40px;
    border: 1px solid #8b00ff;
    color: #e0d4ff;
    box-shadow: 0 0 40px rgba(139, 0, 255, 0.3);
    text-align: center;
}

h1 {
    font-size: 36px;
    color: #c084fc;
    margin-bottom: 8px;
}

.subtitle {
    color: #a78bfa;
    font-size: 13px;
    letter-spacing: 4px;
    margin-bottom: 30px;
}

.divider {
    width: 60px;
    height: 2px;
    background: #c084fc;
    margin: 0 auto 35px;
}

.label {
    font-size: 15px;
    color: #a78bfa;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.qq {
    font-size: 42px;
    font-weight: bold;
    color: #e879f9;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(232, 121, 249, 0.6);
    margin-bottom: 35px;
    word-break: break-all;
}

.btn {
    display: inline-block;
    padding: 14px 45px;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #d946ef);
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(139, 0, 255, 0.5);
    transition: all 0.3s ease;
}

.btn:hover {
    box-shadow: 0 0 50px rgba(139, 0, 255, 0.7);
    transform: translateY(-2px);
}

.back {
    margin-top: 30px;
}

.back a {
    display: inline-block;
    padding: 10px 25px;
    background: transparent;
    color: #a78bfa;
    text-decoration: none;
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid #6a3ab2;
    transition: all 0.3s ease;
}

.back a:hover {
    background: rgba(139, 0, 255, 0.2);
    color: #e0d4ff;
}

@media (max-width: 500px) {
    .card { padding: 35px 20px; }
    h1 { font-size: 26px; }
    .qq { font-size: 30px; }
}
</style>
</head>
<body>

<div class="card">
    <h1>申请加入</h1>
    <div class="subtitle">JOIN US</div>
    <div class="divider"></div>

    <div class="label">企鹅群号</div>
    <div class="qq">1081097184&nbsp;</div>

    <a href="https://qm.qq.com/q/xxxxx " class="btn" target="_blank">一键加群</a >

    <div class="back">
        <a href="index.html">← 返回公会主页</a >
    </div>
</div>

</body>
</html>
