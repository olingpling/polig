<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玩家最新互动 · 天明昭世</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 20px;
}

.card {
    max-width: 1000px;
    width: 100%;
    background: rgba(18, 10, 32, 0.9);
    border-radius: 16px;
    padding: 40px 35px;
    border: 1px solid #8b00ff;
    color: #e0d4ff;
    box-shadow: 0 0 40px rgba(139, 0, 255, 0.2);
}

h1 {
    font-size: 38px;
    text-align: center;
    color: #c084fc;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #a78bfa;
    font-size: 13px;
    letter-spacing: 4px;
    margin-bottom: 30px;
}

.divider {
    width: 60px;
    height: 2px;
    background: #c084fc;
    margin: 0 auto 30px;
}

/* 图片展示 */
.gallery-item {
    margin-bottom: 30px;
}

.gallery-item img {
    width: 100%;
    border-radius: 12px;
    border: 1px solid #6a3ab2;
    display: block;
    box-shadow: 0 0 25px rgba(139, 0, 255, 0.2);
}

.caption {
    text-align: center;
    font-size: 13px;
    color: #9b8ac4;
    margin-top: 12px;
    letter-spacing: 1px;
}

/* 返回按钮 */
.back {
    text-align: center;
    margin-top: 20px;
}

.back a {
    display: inline-block;
    padding: 12px 30px;
    background: #7c3aed;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.back a:hover {
    background: #a855f7;
    transform: translateY(-2px);
}

@media (max-width: 750px) {
    h1 { font-size: 28px; }
    .card { padding: 25px 18px; }
}
</style>
</head>
<body>

<div class="card">
    <h1>玩家最新互动</h1>
    <div class="subtitle">PLAYER ACTIVITY</div>
    <div class="divider"></div>

    <div class="gallery-item">
    <img src="imj1.jpg" alt="公会成员合影" />
    <div class="caption">公会成员合影 · 2026.09.26</div>
</div>

<div class="gallery-item">
    <img src="imj2.jpg" alt="周末集体活动" />
    <div class="caption">周末集体活动 · 主城合影</div>
</div>

    <div class="back">
        <a href="index.html ">← 返回公会主页</a >
    </div>
</div>

</body>
</html>
